<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Pentaksiran Berasaskan Sekolah - SMK Semop</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3fb;--card:#fff;--tx:#14213d;--mut:#51607a;--bd:#d3ddf0;--blue:#0b3fa8;--yel:#ffd400;--red:#d7191c;--hd1:#0b3fa8;--hd2:#082c78}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1426;--card:#142040;--tx:#eaf0ff;--mut:#a9b8d8;--bd:#2a3a66;--hd1:#12358a;--hd2:#0a1f55}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.55 "Segoe UI",Roboto,Arial,sans-serif;padding-bottom:70px}
header{background:linear-gradient(135deg,var(--hd1),var(--hd2));color:#fff;text-align:center;padding:34px 20px 40px;border-bottom:8px solid var(--yel)}
header img{height:150px;filter:drop-shadow(0 4px 8px #0006)}
header h1{margin:12px 0 4px;font-size:36px;letter-spacing:.5px}
header p{margin:0;font-size:22px;color:var(--yel);font-weight:600}
main{max-width:1250px;margin:0 auto;padding:28px 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));gap:22px;align-items:start}
.home{grid-template-columns:repeat(auto-fit,minmax(270px,1fr))}
a.big{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-top:10px solid var(--c);border-radius:18px;padding:26px 22px;text-align:center;transition:.2s}
a.big:hover{transform:translateY(-5px);box-shadow:0 10px 24px #0003}
.big .ic{font-size:64px;line-height:1}
.big h2{margin:10px 0 4px;font-size:28px;color:var(--c)}
.big p{margin:0 0 14px;color:var(--mut);font-size:18px}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--blue));width:0;transition:.3s}
.pc{font-size:17px;color:var(--mut);margin-top:6px}
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.back{background:var(--blue);color:#fff;text-decoration:none;padding:10px 20px;border-radius:30px;font-weight:700;font-size:18px}
.top h2{margin:0;font-size:32px;color:var(--c)}
.sub{color:var(--mut);margin:0 0 22px;font-size:19px}
details{background:var(--card);border:2px solid var(--bd);border-left:10px solid var(--c);border-radius:14px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:16px 18px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
summary::-webkit-details-marker{display:none}
summary .fi{font-size:38px;grid-row:span 2}
summary b{font-size:21px;line-height:1.3}
summary .meta{font-size:16px;color:var(--mut)}
details[open] summary{background:color-mix(in srgb,var(--c) 10%,transparent)}
.list{padding:6px 18px 16px;border-top:1px solid var(--bd)}
label{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--bd);cursor:pointer;font-size:18px}
label:last-child{border:0}
input[type=checkbox]{width:24px;height:24px;margin-top:3px;accent-color:var(--c);flex:none}
.tag{display:inline-block;font-size:15px;background:var(--yel);color:#222;border-radius:12px;padding:0 10px;margin-left:6px;font-weight:700}
.note{background:var(--card);border:2px dashed var(--bd);border-radius:12px;padding:12px 18px;color:var(--mut);margin-bottom:22px;font-size:18px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--hd2);color:#fff;text-align:center;padding:12px 10px calc(12px + env(safe-area-inset-bottom,0px));font-size:19px;font-weight:600;border-top:5px solid var(--yel);z-index:5}
@media(max-width:480px){.grid{grid-template-columns:1fr}header h1{font-size:28px}}
.st{background:#e0f5ea;color:#0a5a38;border:2px solid #8fd6b3;border-radius:12px;padding:10px 18px;margin-bottom:18px;font-size:18px;font-weight:600}
.st.bad{background:#fde4e4;color:#8e1114;border-color:#f0a0a2}
.it{border-bottom:1px dashed var(--bd);padding:9px 0}.it:last-child{border:0}.it label{border:0;padding:0}
.lk{margin:6px 0 0 36px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.go{color:var(--blue);font-weight:700;font-size:17px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#8db4ff}.st{background:#10382a;color:#b8f0d3;border-color:#1d6b4c}.st.bad{background:#4a1a1c;color:#ffc9ca;border-color:#8e3a3d}}
.ed,.sv{font:inherit;font-size:16px;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:20px;padding:3px 14px;cursor:pointer}
.sv{background:var(--blue);color:#fff;border-color:var(--blue)}
.fm{margin:6px 0 0 36px;display:flex;gap:8px}.fm[hidden],.go[hidden]{display:none}
.fm input{flex:1;min-width:0;font:inherit;font-size:17px;padding:6px 10px;border:2px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.fm input{width:auto}.fm{flex-wrap:wrap}.fm .nm{flex:0 1 220px}.ls{margin:6px 0 0 36px}.lr{display:flex;gap:10px;align-items:center;padding:2px 0}.rm{border:0;background:none;color:var(--red);cursor:pointer;font-size:18px}
.tools{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin:-6px 0 18px}
</style></head><body>
<header><img src="logo.jpg" alt="Logo SMK Semop"><h1>Dashboard Pentaksiran Berasaskan Sekolah</h1><p>SMK SEMOP &bull; Kemenjadian &amp; Kecemerlangan</p></header>
<main id="app"></main>
<footer>Pentaksiran Berasaskan Sekolah, SMK Semop</footer>
<script>
const SEC={
pbd:{t:"PBD",ic:"📘",c:"#0b3fa8",d:"Pentaksiran Bilik Darjah",f:[
["👥","Carta Organisasi / AJK",["Carta Organisasi PBD Sekolah","Senarai AJK PBD 2026","Surat pelantikan AJK PBD"]],
["📅","Takwim Pengurusan PBD",["Takwim Pengurusan PBD 2026","Tarikh key-in, penjaminan kualiti dan pelaporan"]],
["👩‍🏫","Senarai Guru dan Mata Pelajaran",["Tingkatan 1","Tingkatan 2","Tingkatan 3","Tingkatan 4","Tingkatan 5"]],
["🧒","Rekod Perkembangan Murid",["Tingkatan 1","Tingkatan 2","Tingkatan 3","Tingkatan 4","Tingkatan 5"]],
["📊","Data PBD dan Analisis PBD (PPSA, PASA)",["Data dan Analisis 2026","Data dan Analisis 2025","Data dan Analisis 2024"]],
["📈","Analisis Penguasaan TP mengikut Tingkatan",["Tingkatan 1","Tingkatan 2","Tingkatan 3","Tingkatan 4","Tingkatan 5"]],
["⚖️","Analisis Perbandingan antara Kelas / Mata Pelajaran",["Perbandingan antara kelas","Perbandingan antara mata pelajaran","Kelas dan mata pelajaran perlu perhatian"]],
["📉","Analisis Trend Pencapaian 2024 - 2026",["Trend PBD 2024 - 2026","Trend UASA 2024 - 2025","Perbandingan PPSA dan PASA"]],
["🖥️","Dashboard Pelaporan PBD",["Cetak skrin dashboard utama / pautan Google Sheets PBD","Rumusan keseluruhan TP sekolah"]],
["📝","Data UASA dan Analisis UASA",["Data dan Analisis UASA 2025","Data dan Analisis UASA 2024"]],
["✅","Penjaminan Kualiti / Mutu",["Borang A 2025","Borang B 2025","Borang C 2025","Borang A 2026","Borang B 2026","Borang C 2026","Rekod Pementoran","Rekod Penyelarasan","Rekod Pemantauan","Rekod Pengesanan"]],
["🔎","Laporan Verifikasi PBD",["Laporan Verifikasi PBD 2026","Laporan Verifikasi PBD 2025"]],
["📜","SPI berkaitan PBD (pautan / Google Drive)",["Senarai SPI dan pautan Google Drive","Surat Siaran KPM berkaitan PBD"]],
["🎯","Intervensi dan Pengayaan",["Pelan Intervensi TP1 dan TP2","Laporan Pelaksanaan Impak / Tindak Susul Intervensi","Program Pengayaan TP5 dan TP6"]]]},
pajsk:{t:"PAJSK & SEGAK",ic:"🏅",c:"#d7191c",d:"Pentaksiran Aktiviti Jasmani, Sukan dan Kokurikulum serta Standard Kecergasan Fizikal",f:[
["👥","Organisasi dan AJK PAJSK / SEGAK",["Carta organisasi","Senarai AJK dan guru penyelaras","Surat pelantikan"]],
["📅","Takwim dan Jadual Pelaksanaan",["Takwim PAJSK 2026","Takwim ujian SEGAK 2026","Jadual kemas kini data sistem"]],
["📜","Garis Panduan dan SPI",["Buku Panduan PAJSK","Garis panduan SEGAK","SPI dan surat siaran KPM"]],
["🧾","Rekod Markah PAJSK mengikut Tingkatan",["Tingkatan 1","Tingkatan 2","Tingkatan 3","Tingkatan 4","Tingkatan 5"]],
["🎽","Unit Beruniform, Kelab dan Sukan",["Rekod penglibatan Unit Beruniform","Rekod penglibatan Kelab dan Persatuan","Rekod penglibatan Sukan dan Permainan"]],
["🏆","Pencapaian dan Sijil Murid",["Pencapaian peringkat sekolah dan daerah","Pencapaian peringkat negeri dan kebangsaan","Bukti sijil dan gambar"]],
["❤️","Ujian SEGAK dan BMI",["Rekod ujian SEGAK Bahagian 1 (BMI)","Rekod ujian SEGAK Bahagian 2 (ujian fizikal)","Borang ujian dan senarai kehadiran"]],
["📈","Analisis Status Kecergasan",["Analisis mengikut tingkatan dan gender","Analisis perbandingan antara sesi","Senarai murid tidak cergas"]],
["🎯","Intervensi dan Tindakan Susulan",["Pelan intervensi kecergasan","Laporan impak intervensi"]],
["📣","Laporan dan Mesyuarat",["Laporan analisis PAJSK / SEGAK","Minit mesyuarat"]]]},
psi:{t:"PSIKOMETRIK",ic:"🧠",c:"#7a3db8",d:"Ujian dan profil psikometrik murid",f:[
["👥","Organisasi dan Pelaksana",["Carta organisasi / AJK","Senarai Guru Bimbingan dan Kaunseling","Surat pelantikan"]],
["📅","Takwim dan Jadual Ujian",["Takwim pelaksanaan","Jadual ujian mengikut tingkatan"]],
["📜","Garis Panduan dan Etika",["Garis panduan KPM","Etika dan kerahsiaan data murid","Surat kebenaran pentadbiran"]],
["🧪","Instrumen Ujian",["Inventori personaliti","Inventori minat kerjaya","Gaya pembelajaran","Kecerdasan pelbagai"]],
["📊","Keputusan dan Analisis",["Tingkatan 1","Tingkatan 2","Tingkatan 3","Tingkatan 4","Tingkatan 5"]],
["🪪","Profil Individu Murid",["Profil psikometrik individu","Rumusan kekuatan dan keperluan murid"]],
["🧭","Bimbingan Kerjaya dan Laluan Pendidikan",["Pemadanan minat dengan aliran","Laporan sesi bimbingan kerjaya"]],
["🤝","Rujukan dan Intervensi",["Senarai murid perlu pemantauan","Rekod sesi kaunseling dan susulan","Laporan impak intervensi"]],
["📣","Laporan dan Mesyuarat",["Laporan tahunan psikometrik","Minit mesyuarat dan maklum balas"]]]}
};
let D={},db=null,ST=["Memuatkan data...",0];
try{D=JSON.parse(localStorage.getItem("semop2")||"{}")}catch(e){}
const app=document.getElementById("app");
const okUrl=u=>/^https?:\/\/[^\s]+$/i.test(u);
const getLinks=d=>{const L=Array.isArray(d.links)?d.links.slice():[];if(d.link)L.unshift({t:"",u:d.link});return L.filter(x=>x&&okUrl(x.u))};
const done=(k,i,j)=>!!(D[k+i+"_"+j]&&D[k+i+"_"+j].done);
const cnt=(k,i)=>{const n=SEC[k].f[i][2];return[n.filter((_,j)=>done(k,i,j)).length,n.length]};
const tot=k=>{let a=0,b=0;SEC[k].f.forEach((_,i)=>{const[x,y]=cnt(k,i);a+=x;b+=y});return[a,b]};
const pct=k=>{const[a,b]=tot(k);return Math.round(a/b*100)};
const cur=()=>{const h=location.hash.slice(1);return SEC[h]?h:""};
function msg(t,bad){ST=[t,bad];const e=document.getElementById("st");if(e){e.textContent=t;e.className="st"+(bad?" bad":"")}}
const API="PASTE_URL_APPS_SCRIPT_DI_SINI";
const SHEET="PASTE_URL_GOOGLE_SHEET_DI_SINI";
let pw="";try{pw=sessionStorage.getItem("semop_pw")||""}catch(e){}
const meta=key=>{const m=/^([a-z]+)(\d+)_(\d+)$/.exec(key);if(!m||!SEC[m[1]])return{};const s=SEC[m[1]],f=s.f[+m[2]];return{b:s.t,f:f[1],d:f[2][+m[3]]}};
const cache=()=>{try{localStorage.setItem("semop2",JSON.stringify(D))}catch(e){}};
function setItem(key,p){D[key]=Object.assign({},D[key],p);paint();cache();send(key)}
async function send(key,retry){
if(!API.startsWith("http"))return;
const d=D[key],m=meta(key);
try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:key,done:!!d.done,links:getLinks(d),b:m.b,f:m.f,d:m.d,pw:pw})});
const j=await r.json();
if(j.error==="auth"){if(retry){msg("Kata laluan salah.",1);return}const x=prompt("Masukkan kata laluan guru untuk menyimpan data:");if(x===null)return;pw=x;try{sessionStorage.setItem("semop_pw",pw)}catch(e){}return send(key,1)}
if(j.ok)msg("Disimpan ke Google Sheet pada "+new Date().toLocaleTimeString("ms-MY"),0);else msg("Gagal menyimpan: "+(j.error||"ralat"),1)}
catch(e){msg("Gagal menyambung ke Google Sheet. Semak sambungan internet.",1)}}
async function load(){
if(!API.startsWith("http")){msg("Pautan Google Sheet belum ditetapkan. Data hanya dalam pelayar ini.",1);return}
try{const r=await fetch(API);const j=await r.json();if(j.data){D=j.data;cache();paint();msg("Bersambung ke Google Sheet.",0)}}
catch(e){msg("Tidak dapat memuat data dari Google Sheet.",1)}}
function csv(){const rows=[["Bahagian","Folder","Dokumen","Status","Pautan"]];
Object.keys(SEC).forEach(k=>SEC[k].f.forEach((f,i)=>f[2].forEach((x,j)=>{const d=D[k+i+"_"+j]||{};rows.push([SEC[k].t,f[1],x,d.done?"Lengkap":"Belum",getLinks(d).map(l=>(l.t?l.t+": ":"")+l.u).join("\n")])})));
const t="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:"text/csv;charset=utf-8"}));a.download="data_pbd_smk_semop.csv";document.body.append(a);a.click();a.remove()}
document.addEventListener("click",e=>{if(e.target.dataset&&e.target.dataset.a==="csv")csv()});
function render(){
const h=cur();
if(!h){app.innerHTML='<div id="st" class="st"></div><div class="tools"><button class="ed" type="button" data-a="csv">⬇ Muat turun data (CSV)</button><a class="go" id="sh" target="_blank" rel="noopener">📊 Buka Google Sheet</a></div><p class="sub" style="text-align:center">Pilih folder untuk membuka dokumen dan rekod pentaksiran sekolah.</p><div class="grid home">'+
Object.keys(SEC).map(k=>{const s=SEC[k];return`<a class="big" href="#${k}" style="--c:${s.c}"><div class="ic">${s.ic}</div><h2>${s.t}</h2><p>${s.d}</p><div class="bar"><i data-t="${k}"></i></div><div class="pc" data-p="${k}"></div></a>`}).join("")+"</div>"}
else{const s=SEC[h];
app.innerHTML=`<div class="top" style="--c:${s.c}"><a class="back" href="#">&larr; Utama</a><h2>${s.ic} ${s.t}</h2></div><p class="sub">${s.d}</p><div id="st" class="st"></div><div class="tools"><button class="ed" type="button" data-a="csv">⬇ Muat turun data (CSV)</button><a class="go" id="sh" target="_blank" rel="noopener">📊 Buka Google Sheet</a></div><div class="note">Tandakan ( / ) dan tambah pautan Google Drive / Sheets pada setiap dokumen. Semua perubahan dikongsi dengan pengguna lain.</div><div class="grid">`+
s.f.map((f,i)=>`<details style="--c:${s.c}"><summary><span class="fi">${f[0]}</span><b>${f[1]}</b><span class="meta" data-m="${i}"></span></summary><div class="list">`+
f[2].map((x,j)=>`<div class="it" data-k="${h+i}_${j}"><label><input type="checkbox"><span>${x}</span></label><div class="ls"></div><div class="lk"><button class="ed" type="button">+ Tambah pautan</button></div><div class="fm" hidden><input class="nm" placeholder="Nama (cth: Tingkatan 1)"><input class="ur" type="url" placeholder="Tampal pautan https://..."><button class="sv" type="button">Simpan</button></div></div>`).join("")+"</div></details>").join("")+"</div>"}
const sh=document.getElementById("sh");if(sh){if(SHEET.startsWith("http"))sh.href=SHEET;else sh.hidden=true}msg(ST[0],ST[1]);paint()}
function paint(){
const h=cur();
if(!h){Object.keys(SEC).forEach(k=>{const b=app.querySelector(`[data-t="${k}"]`),p=app.querySelector(`[data-p="${k}"]`);if(b){b.style.width=pct(k)+"%";p.textContent=pct(k)+"% lengkap \u2022 "+SEC[k].f.length+" folder"}});return}
app.querySelectorAll(".it").forEach(it=>{const d=D[it.dataset.k]||{},ls=it.querySelector(".ls");
it.querySelector("input[type=checkbox]").checked=!!d.done;
ls.textContent="";getLinks(d).forEach((x,n)=>{const r=document.createElement("div");r.className="lr";const a=document.createElement("a");a.className="go";a.target="_blank";a.rel="noopener";a.href=x.u;a.textContent="🔗 "+(x.t||"Buka dokumen "+(n+1));const b=document.createElement("button");b.className="rm";b.type="button";b.dataset.n=n;b.title="Padam pautan";b.textContent="✕";r.append(a,b);ls.append(r)})});
app.querySelectorAll("[data-m]").forEach(m=>{const[a,b]=cnt(h,+m.dataset.m);m.textContent=a+" / "+b+" lengkap"})}
app.addEventListener("change",e=>{const it=e.target.closest(".it");if(it&&e.target.type==="checkbox")setItem(it.dataset.k,{done:e.target.checked})});
app.addEventListener("click",e=>{const it=e.target.closest(".it");if(!it)return;const k=it.dataset.k,fm=it.querySelector(".fm"),nm=fm.querySelector(".nm"),ur=fm.querySelector(".ur"),c=e.target.classList;
if(c.contains("ed")){fm.hidden=!fm.hidden;if(!fm.hidden)nm.focus()}
if(c.contains("rm")){const L=getLinks(D[k]||{});L.splice(+e.target.dataset.n,1);setItem(k,{links:L,link:""})}
if(c.contains("sv")){const v=ur.value.trim();if(okUrl(v)){setItem(k,{links:getLinks(D[k]||{}).concat([{t:nm.value.trim().slice(0,60),u:v}]),link:""});nm.value=ur.value="";fm.hidden=true}else msg("Pautan mesti bermula dengan https://",1)}});
addEventListener("hashchange",()=>{render();scrollTo(0,0)});render();
load();setInterval(()=>{if(!document.hidden&&!document.querySelector(".fm:not([hidden])"))load()},45000);
</script></body></html>
